# 추천 합성 가중치 (jev-recommender SKILL 6절). 키 정의: src/tft_advisor/config.py (Weights)
# 초기값은 설계 기본값이며 튜닝 대상. debug 로그의 원시 판단으로 재계산해 조정한다.

[comp]
# resource_fit = wi*item_fit + wa*augment_fit + wb*board_fit  (wi+wa+wb = 1)
wi = 0.45
wa = 0.25
wb = 0.30
# comp_score = resource_fit*(1-wt) + wt*stat_norm
wt = 0.2
show_ratio = 0.75        # 2·3위는 1위 점수의 이 비율 이상일 때만 표시
max_shown = 3
hysteresis_bonus = 0.05  # 직전 추천 덱 가산(널뛰기 방지)

[shop]
buy_threshold = 0.5
# shop_score = ws(stage)*now_value + wp(stage)*path_value. 키 = 스테이지 번호, 표에 없는 스테이지는 가장 가까운 아래 값
[shop.stage_weights]
"1" = { ws = 0.8, wp = 0.2 }
"2" = { ws = 0.7, wp = 0.3 }
"3" = { ws = 0.5, wp = 0.5 }
"4" = { ws = 0.3, wp = 0.7 }
"5" = { ws = 0.2, wp = 0.8 }

[shrinkage]
# adj = (games*x + k*prior)/(games + k)
k = 200
prior_avg_place = 4.5

[jev]
min_confidence = 0.5     # 이보다 낮은 Jev 답은 가중치 축소
low_confidence_scale = 0.5

[augment]
# Set 18은 증강 통계 없음 → Jev 판단 + 편집자 등급(MetaTFT) 합성
w_jev = 0.7
w_editorial = 0.3
[augment.editorial_tier_score]
S = 1.0
A = 0.75
B = 0.5
C = 0.25
D = 0.0
