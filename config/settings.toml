# TFT Advisor 실행 설정. 키 정의: src/tft_advisor/config.py (Settings)
# 비밀값(API 키)은 여기 두지 않는다. TypeSafe 키는 환경변수 TYPESAFE_API_KEY.

[app]
set_number = 18
data_dir = "data"
log_dir = "logs"
state_dir = "_state"     # 세션 상태(_state/session.json)·오버레이 위치(overlay.json). git에 올리지 않는다

[capture]
monitor = 1              # mss 모니터 번호(1 = 주 모니터)
# 캡처 주기·안정 프레임은 [vision] capture_fps / change_stable_frames (옛 poll_interval_ms·stable_frames 대체)

[vision]
# --- 화면 크기 / 비율 -------------------------------------------------------
# 게임 해상도. "auto"(기본) = 캡처한 프레임 크기를 그대로 쓴다.
# "1920x1080" 처럼 적으면 그 비율로 ROI를 고르고, 실제 캡처 크기가 다르면 경고한다(캡처 영역 설정 실수 확인용).
resolution = "auto"
# ROI 배치를 고를 화면 비율. "auto"(기본) = 프레임(content_box 적용 후) 비율에서 자동 판별.
# "16:9" | "16:10" | "4:3" | "21:9" | "32:9". 16:9와 16:10만 실제 캡처로 측정했고 나머지는 16:9에서 유도한다(미검증).
# 자동 판별이 틀리면(예: 캡처에 게임 밖 영역이 섞임) 여기서 못박는다.
aspect = "auto"
# 고급: ROI 프로파일 이름을 직접 못박는다. "auto"(기본)가 아니면 aspect·resolution보다 우선한다.
# "set18_16x9" | "set18_16x10" | 해상도 별칭("1920x1080", "1280x800", …)
profile = "auto"
# 게임 화면 영역 [x1, y1, x2, y2] — 캡처 프레임에 대한 비율(0 <= x1 < x2 <= 1, y 동일).
# 생략 또는 [] = 프레임 전체(= [0, 0, 1, 1]). 전체 화면/테두리 없는 창모드면 그대로 둔다.
# 창모드로 바탕화면이 함께 찍히면 게임 영역을 지정한다.
# 예: 2560x1440 모니터의 (200,150) 위치 1600x900 창 → [0.078125, 0.104167, 0.703125, 0.729167]
# content_box = [0, 0, 1, 1]
content_box_auto = true  # content_box가 없을 때 레터박스(위아래/좌우 검은 띠)를 자동으로 잘라낸다

shop_fuzzy_min = 85      # rapidfuzz 점수(0~100) 미만이면 None
icon_match_min = 0.8     # 템플릿 매칭 점수 미만이면 None
state_min_confidence = 0.6   # 이보다 낮은 필드는 Jev state에서 제외
ocr_backend = "auto"          # "auto" | "onnxruntime" | "openvino" | "none"(OCR 끔, 진단용)
name_fuzzy_min_margin = 10    # 이름 점수 >= shop_fuzzy_min 이어도 2위와 이만큼 차이 나야 수락 (<= relaxed)
name_fuzzy_relaxed_margin = 15   # 점수 60~85 구간 수락에 필요한 2위와의 차
item_match_margin = 0.05      # 아이템 아이콘 1위와 다른 아이템 1위의 점수 차 하한
change_threshold = 24         # ROI 서명(32x16 회색조) 픽셀 절대차 최댓값이 이보다 크면 변화 (0~255)
change_stable_frames = 2      # 변화 후 이 프레임 수 연속 같아야 재인식 (애니메이션 중 읽지 않음)
capture_fps = 4               # 앱 루프 캡처 주기(Phase 4). 인식·추천은 변화가 있을 때만
traits_every_s = 3            # 앱 루프: 특성 패널을 몇 초에 한 번 읽을지(비싼 ROI)

[advisor]
jev_backend = "mock"          # "mock"(기본, 네트워크·과금 없음) | "live"(TYPESAFE_API_KEY 필요, 과금) | "off"(통계 전용). CLI --no-jev → "off"
jev_enabled = true            # false → fallback_reason = jev_disabled
timeout_s = 2.0               # 추천 1회 전체 예산(초)
max_candidate_comps = 8       # 코드 1차 필터 후 Jev에 보낼 덱 후보 수 (1~20)
cache_size = 64               # state 해시 LRU 캐시 (0 = 끔)
jev_model = "jev-latest"      # "jev-latest" 또는 고정 버전 "jev-1.13.0". 캐시 키·state_hash에 포함
jev_timeout_s = 1.2           # Jev 시도 1회 타임아웃 (jev_timeout_s <= jev_retry_budget_s < timeout_s)
jev_retry_budget_s = 1.5      # RetryPolicy 총 예산
jev_max_retries = 1           # 0~3
circuit_fail_threshold = 3    # 연속 실패 이 횟수면 서킷 오픈
circuit_cooldown_s = 60       # 서킷 오픈 유지 시간

[stats]
primary = "metatft"
fallbacks = ["tactics_tools", "opgg_mcp"]
db_path = "data/stats/stats.sqlite"
days = 3
rank_filter = "CHALLENGER,DIAMOND,GRANDMASTER,MASTER"   # 순서 무관(집합 비교), 로드 시 정렬
request_interval_s = 1.2
keep_snapshots = 5            # 출처별 보존 스냅샷 수 (>= 1)
user_agent = "tft-advisor-research/0.1 (personal use)"

[ui]
# Phase 4에서 오버레이는 PySide6로 확정. "auto" = PySide6가 있으면 오버레이, 없으면 콘솔.
# "console" = 오버레이 없이 콘솔 출력(CLI --no-overlay와 같음). "tkinter"는 미구현(경고 후 콘솔).
backend = "auto"
opacity = 0.85           # [overlay] opacity 가 없을 때의 값
click_through = true     # [overlay] click_through 가 없을 때의 값
max_target_comps = 3     # 오버레이에 표시할 목표 덱 수(advisor 순서 그대로, 점수로 재정렬하지 않음)

[overlay]
enabled = true
anchor = "top_right"     # "top_left" | "top_right" | "bottom_left" | "bottom_right"
x = 24                   # anchor 모서리로부터 가로 여백 px
y = 24                   # 세로 여백 px
width = 380              # 창 너비 px
scale = 1.0              # 글꼴·여백 배율 (0.5 ~ 3.0)
# opacity = 0.85         # 생략하면 [ui] opacity
# click_through = true   # 생략하면 [ui] click_through
locked = true            # true = 클릭 통과(게임 입력을 가리지 않음). false = 드래그로 이동 가능
always_on_top = true
screen = 0               # 여러 모니터일 때 Qt 화면 번호
remember_position = true # _state/overlay.json 에 저장된 위치를 우선 사용

[logging]
level = "INFO"
recommendation_log = "logs/recommendations.jsonl"
save_frame_on_error = true
